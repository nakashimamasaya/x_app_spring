server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # ハッシュ付きのアセットは長期キャッシュしてよい
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA なので、存在しないパスは index.html に落としてクライアント側で解決させる。
    # これが無いと /users/alice を直接開いたときに 404 になる
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 開発サーバーと違い、ここでは API をプロキシしない。
    # BFF を置かない構成なので、ブラウザは API を直接叩く（docs/adr/0001）
}
