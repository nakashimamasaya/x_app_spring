# 開発用。起動前に `cp .env.example .env` して JWT_SECRET を設定すること。
#   openssl rand -base64 48
#
# フロントエンドは frontend/ 作成後に web サービスを追加する（ホストの Node は
# v16.5.0 で Vite 8 の要件を満たさないため、コンテナ内でのみ動かす）。

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xapp}
      POSTGRES_USER: ${POSTGRES_USER:-xapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD が未設定です。.env を作成してください}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 以降は /var/lib/postgresql/data ではなく /var/lib/postgresql に
      # マウントするのが推奨。データは配下のサブディレクトリに置かれ、
      # pg_upgrade --link がマウント境界をまたがずに使える。
      # 旧来の /data にマウントすると起動時に弾かれる。
      - db-data:/var/lib/postgresql
    healthcheck:
      # api の depends_on が healthy を待つため、これが無いと接続失敗で起動に失敗する
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xapp} -d ${POSTGRES_DB:-xapp}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-xapp}
      POSTGRES_USER: ${POSTGRES_USER:-xapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET が未設定です。openssl rand -base64 48 で生成してください}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-P14D}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  db-data:
